[project]
name = "dealfinder"
version = "0.1.0"
description = "Tell Claude what you want to buy; it interviews you, searches, and judges every listing."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "anthropic>=0.40", "httpx>=0.27", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dealfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
