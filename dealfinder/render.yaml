services:
  - type: web
    name: dealfinder
    runtime: python
    rootDir: dealfinder
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn dealfinder.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
