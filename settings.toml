# Shared settings: `git pull` updates this file, and the scraper reads it automatically.
# To override something just for you (or keep a private ntfy topic), put it in config.local.toml,
# which git never touches and which wins over this file. Command-line flags win over both.

max_total = 500        # dollars, including shipping (was 700 - change back here when you want)
min_price = 250        # cheaper than this = part / accessory / scam / empty box (auctions exempt)
offer_stretch = 75     # default for "Include flexible prices?": keep Best Offer/local listings up to $75 over budget; 0 = no
chips = ["M2", "M3", "M4"]
ram_options = [24, 32]
models = ["macbook", "mac mini", "mac studio"]   # also possible: "imac"
mini_penalty = 5                   # rank desktops (mini/Studio) a little below MacBooks; 0 = equal
no_auctions = false    # default answer to "Include auctions?" at startup
stale_days = 10        # Reddit posts older than this stay POSSIBLE, with a "may be gone" note
loose = true          # keep listings that state neither chip nor RAM, as POSSIBLE (ask the seller); false drops them
deep = false           # open each candidate page to read specs + description (slower, more accurate)

sources = ["ebay", "craigslist", "reddit"]
facebook_city = "chicago"   # city in the report's Facebook Marketplace links (works without a Facebook account)

# Craigslist, part 1 - LOCAL: your nearest Craigslist subdomains (the part before .craigslist.org,
# e.g. https://sfbay.craigslist.org -> "sfbay"). Everything here counts as local pickup.
craigslist_sites = ["chicago"]   # covers Northwest Indiana
# Only local listings within this many miles of your ZIP code.
home_zip = "46321"               # Munster, IN
max_distance_miles = 40

# Craigslist, part 2 - OTHER CITIES: searched too, but a post is only kept if the seller
# says they'll ship ("will ship", "shipping available", "+ shipping", ...). "Local only" posts are dropped.
craigslist_ship_sites = ["indianapolis", "milwaukee", "detroit", "newyork", "losangeles", "sfbay", "seattle", "boston"]

# Free phone push notifications: install the ntfy app, subscribe to a hard-to-guess topic.
# (put your ntfy_topic in config.local.toml, not here)

# Extra words that should disqualify a listing (regex, case-insensitive).
extra_red_flags = ["dent", "bent"]

# Override the search queries if you like.
# ebay_queries = ["macbook air m2 24gb", "mac mini m2 24gb"]
# craigslist_queries = ["macbook", "mac mini", "mac studio"]
# reddit_queries = ["24GB", "32GB"]
